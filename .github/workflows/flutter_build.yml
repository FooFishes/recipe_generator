name: Build Flutter App (Analyze • Test • Package)

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      buildInstaller:
        description: '是否构建 Windows 安装器（非 tag 情况下测试用）'
        type: choice
        options: [no, yes]
        default: no

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.29.2'
  FLUTTER_CHANNEL: 'stable'
  APP_EXECUTABLE_NAME: recipe_generator
  INSTALLER_BASE_NAME: RecipeGenerator-Setup
  WINDOWS_BUILD_DIR: build/windows/x64/runner/Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run tests
        continue-on-error: true
        run: flutter test

      - name: Build Android APK
        if: runner.os == 'Linux'
        run: flutter build apk --release

      - name: Build Android AppBundle
        if: runner.os == 'Linux'
        run: flutter build appbundle --release

      - name: Build Web
        if: runner.os == 'Linux'
        run: flutter build web --release

      - name: Build Windows
        if: runner.os == 'Windows'
        run: flutter build windows --release

      # Installer preparation (tag OR manual dispatch asking yes)
      - name: Setup Inno Setup
        if: runner.os == 'Windows' && (startsWith(github.ref, 'refs/tags/') || inputs.buildInstaller == 'yes')
        uses: MinoruSekine/setup-inno-setup@v3

      - name: Stage files for Inno Setup
        if: runner.os == 'Windows' && (startsWith(github.ref, 'refs/tags/') || inputs.buildInstaller == 'yes')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging, staging\other | Out-Null
          $buildDir = "${{ env.WINDOWS_BUILD_DIR }}"
          $exe = "${{ env.APP_EXECUTABLE_NAME }}.exe"
          if (!(Test-Path "$buildDir\$exe")) {
            Write-Error "Executable $buildDir\$exe not found. Check APP_EXECUTABLE_NAME."
          }
          Copy-Item "$buildDir\$exe" -Destination "staging\"
          Copy-Item "$buildDir\*" -Destination "staging\other\" -Recurse -Exclude $exe

      - name: Update .iss version
        if: runner.os == 'Windows' && (startsWith(github.ref, 'refs/tags/') || inputs.buildInstaller == 'yes')
        shell: pwsh
        run: |
          $refName = "${{ github.ref_name }}"
          if ($refName -match '^v\d') {
            $version = $refName.Substring(1)
          } else {
            # 非 tag 手动触发时给一个占位或时间戳
            if ("${{ github.event_name }}" -eq "workflow_dispatch") {
              $version = (Get-Date -Format "0.0.0-HHmmss")
            } else {
              $version = "0.0.0-dev"
            }
          }
          $issPath = "script\windows_build.iss"
          if (!(Test-Path $issPath)) { Write-Error "ISS file not found at $issPath"; exit 1 }
          (Get-Content $issPath) -replace 'VERSION_PLACEHOLDER', $version | Set-Content $issPath
          Write-Host "Injected version $version into $issPath"

      - name: Compile installer (Inno Setup)
        if: runner.os == 'Windows' && (startsWith(github.ref, 'refs/tags/') || inputs.buildInstaller == 'yes')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output | Out-Null
          iscc.exe /Qp /Ooutput "script\windows_build.iss"
          $expected = "output\${{ env.INSTALLER_BASE_NAME }}.exe"
          if (!(Test-Path $expected)) {
            Write-Error "Installer not found at $expected"
          }

      - name: Upload APK
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/apk/release/app-release.apk
          retention-days: 7

      - name: Upload AAB
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

      - name: Upload Web build
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 7

      - name: Upload Windows build dir
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: ${{ env.WINDOWS_BUILD_DIR }}
          retention-days: 7

      - name: Upload Windows installer
        if: runner.os == 'Windows' && (startsWith(github.ref, 'refs/tags/') || inputs.buildInstaller == 'yes')
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: output/${{ env.INSTALLER_BASE_NAME }}.exe
          retention-days: 7
