name: Build Flutter App (Analyze • Test • Package)

on:
  push:
    branches: [main]
    tags:
      - 'v*'          # 推送 v 开头的 tag：构建并生成安装器
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: '自定义版本号 (例如 1.2.3 或 1.2.3-beta)，留空则自动生成'
        required: false
      buildInstaller:
        description: '是否构建 Windows 安装器（手动触发时可控）'
        type: choice
        options: [no, yes]
        default: yes

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.29.2'
  FLUTTER_CHANNEL: 'stable'
  APP_EXECUTABLE_NAME: recipe_generator
  INSTALLER_BASE_NAME: RecipeGenerator-Setup
  WINDOWS_BUILD_DIR: build/windows/x64/runner/Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Resolve version
        id: resolve_version
        shell: pwsh
        run: |
          $event = "${{ github.event_name }}"
          $refName = "${{ github.ref_name }}"
          $inputVersion = "${{ inputs.version }}"
          if ($event -eq "workflow_dispatch") {
            if ($inputVersion) {
              $version = $inputVersion
            } else {
              $version = (Get-Date -Format "0.0.0-yyyyMMddHHmmss")
            }
          } elseif ($refName -match '^v\d') {
            # tag: v1.2.3
            $version = $refName.Substring(1)
          } else {
            $version = "0.0.0-${{ github.run_number }}"
          }
          "APP_VERSION=$version" | Out-File -FilePath $Env:GITHUB_ENV -Append
          Write-Host "Resolved version: $version"
          Write-Host "::notice title=Build Version::$version"

      - name: Show version (debug)
        run: echo "Building version: $APP_VERSION"

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run tests
        continue-on-error: true
        run: flutter test

      # Android (Linux)
      - name: Build Android APK
        if: runner.os == 'Linux'
        run: flutter build apk --release

      - name: Build Android AppBundle
        if: runner.os == 'Linux'
        run: flutter build appbundle --release

      # Web (Linux)
      - name: Build Web
        if: runner.os == 'Linux'
        run: flutter build web --release

      # Windows (Windows)
      - name: Build Windows
        if: runner.os == 'Windows'
        run: flutter build windows --release

      # ---------------- Windows Installer (tag 或 手动触发且指定) ----------------
      - name: Setup Inno Setup
        if: runner.os == 'Windows' && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.buildInstaller == 'yes'))
        uses: MinoruSekine/setup-inno-setup@v3

      - name: Stage files for Inno Setup
        if: runner.os == 'Windows' && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.buildInstaller == 'yes'))
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging, staging\other | Out-Null
            # 使用构建目录
          $buildDir = "${{ env.WINDOWS_BUILD_DIR }}"
          $exe = "${{ env.APP_EXECUTABLE_NAME }}.exe"
          if (!(Test-Path "$buildDir\$exe")) {
            Write-Error "Executable $buildDir\$exe not found. Check APP_EXECUTABLE_NAME or build output."
          }
          Copy-Item "$buildDir\$exe" -Destination "staging\"
          Copy-Item "$buildDir\*" -Destination "staging\other\" -Recurse -Exclude $exe

      - name: Update .iss version
        if: runner.os == 'Windows' && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.buildInstaller == 'yes'))
        shell: pwsh
        run: |
          $issPath = "script\windows_build.iss"
          if (!(Test-Path $issPath)) { Write-Error "ISS file not found at $issPath"; exit 1 }
          (Get-Content $issPath) -replace 'VERSION_PLACEHOLDER', $env:APP_VERSION | Set-Content $issPath
          Write-Host "Injected version $env:APP_VERSION into $issPath"

      - name: Compile installer (Inno Setup)
        if: runner.os == 'Windows' && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.buildInstaller == 'yes'))
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output | Out-Null
          iscc.exe /Qp /Ooutput "script\windows_build.iss"
          $expected = "output\${{ env.INSTALLER_BASE_NAME }}.exe"
          if (!(Test-Path $expected)) {
            Get-ChildItem output
            Write-Error "Installer not found at $expected"
          } else {
            Write-Host "Installer generated: $expected"
          }

      # ---------------- Artifacts ----------------
      - name: Upload APK
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/apk/release/app-release.apk
          retention-days: 7

      - name: Upload AAB
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

      - name: Upload Web build
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 7

      - name: Upload Windows build dir
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: ${{ env.WINDOWS_BUILD_DIR }}
          retention-days: 7

      - name: Upload Windows installer
        if: runner.os == 'Windows' && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.buildInstaller == 'yes'))
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: output/${{ env.INSTALLER_BASE_NAME }}.exe
          retention-days: 7
